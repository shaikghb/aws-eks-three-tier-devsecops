name: Reusable security checks

on:
  workflow_call:
    inputs:
      scan-path:
        required: false
        type: string
        default: .
    secrets:
      GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem and dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
