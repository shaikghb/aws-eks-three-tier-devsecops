name: CI and Security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - name: Install dependencies
        working-directory: app/backend
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        working-directory: app/backend
        run: npm run check
      - name: Unit tests
        working-directory: app/backend
        run: npm test
      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

  container-scan:
    name: Build and scan container images
    runs-on: ubuntu-latest
    needs: [api, frontend]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t three-tier-api:ci ./app/backend
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: three-tier-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Build frontend image
        run: docker build -t three-tier-frontend:ci ./app/frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: three-tier-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
